# The virtual gamepad for Amiberry (the launcher's docs/virtual-gamepad-plan.md; rc/pad.default.ini has the rest).
#
# Amiberry's menu moves on the hat and on the left stick alike, so the default cross-feeding (movement = both)
# turned every D-pad press into two steps. Its Amiga joystick reads the D-pad too - nothing needs a stick fed.
movement = as-is
