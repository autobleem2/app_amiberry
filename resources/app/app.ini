[app]
Title=Amiberry
Author=Amiberry-Lite by Dimitris Panokostas (BlitterStudio), on WinUAE by Toni Wilen
Version=5.9.3-1
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/amiberry-lite on the console,
# bin/rpi, bin/rpi64, bin/pcusb on the appliances. There is no Windows build (Amiberry-Lite is Linux-only).
# The launcher starts an App in its own folder, and amiberry.portable there keeps everything in it: the
# settings (conf/), Kickstarts (roms/), disks (floppies/, lha/, harddrives/), save states, screenshots.
Exec=bin/{key}/amiberry-lite
# SDL2, SDL2_image and SDL2_ttf are the launcher's (the console) or the system's; the rest is linked in
# Amiberry reads the pad through SDL's GameController API; the virtual pad shows it an Xbox 360 pad, which
# patches/amiberry-lite/0002-autobleem-defaults.patch lays out as the 2019 PlayStation Classic port did
VirtualPad=true
Kernel=false
